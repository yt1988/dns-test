# Cloudflare Workers with static assets: `npx wrangler deploy` uploads ./public.
# Files in ./public are served as they are, before the Worker runs (free and not metered). src/worker.js only sees
# paths that are not files: /i, /v and /dl/* (the command-line tool's installer and release files, passed on from
# GitHub for places where it is blocked), and answers anything else with a bare 404.
# No routes or custom domain here: on 1ms.dog the site routes the domain to this Worker. To self-host, bind your own
# domain in the dashboard (see README).
name = "dns-test"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
