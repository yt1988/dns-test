<!doctype html>
<html lang="{{lang}}" data-paths="{{pathsAttr}}"{{rootAttr}}>
<head>
<meta charset="utf-8">
<script>{{prepaint}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head}}
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/{{css}}">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="{{homeHref}}" aria-current="page">
      <span class="logo"><img class="logo-light" src="/assets/logo-light.svg" width="90" height="36" alt="{{a:a_logo}}" loading="lazy" decoding="async"><img class="logo-dark" src="/assets/logo-dark.svg" width="90" height="36" alt="{{a:a_logo}}" loading="lazy" decoding="async"></span>
      <span class="brand-name" data-i="app_name"></span>
    </a>
    <div class="top-acts">
      <label class="sel"><span class="sr" data-i="lang_label"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2.8 4 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.5 5.2 8S6 3.5 8 1.5z"/></svg>
        <select id="lang">{{langOpts}}</select>
      </label>
      <button class="icon-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help"><span class="sr" data-i="faq_h"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4M8 11.3v.1"/></svg>
      </button>
      <a class="icon-btn gh" href="https://github.com/yt1988/dns-test" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a>
      <button class="icon-btn" id="theme" type="button" aria-label="{{a:a_theme}}">
        <svg class="i-sys" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
        <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero card">
      <h1>{{h1}}</h1>
      <div class="win">
        <div class="win-l">
          <span class="win-k" id="winK">{{winK}}</span>
          <div class="win-n"><span class="win-id"><span class="win-ic" id="winIc"{{winIcAttr}}></span><b id="winName">{{winName}}</b>
            <span class="use-w">
              <button class="btn sm" id="useBtn" type="button" aria-expanded="false" aria-controls="use" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span data-i="use_h"></span></button>
              <ul class="use" id="use" hidden>
                <li><span></span><code></code></li><li><span></span><code></code></li><li><span></span><code></code></li>
              </ul>
            </span></span>
          </div>
          <span class="win-s" id="winSub">&nbsp;</span>
          <ul class="win-m">
            <li data-w="doh"><span><span data-i="c_doh"></span> <i data-i="w_real"></i></span><b>–</b></li>
            <li data-w="udp"><span><span data-i="c_udp"></span> <i data-i="w_est"></i></span><b>–</b></li>
            <li data-w="dot"><span><span data-i="c_dot"></span> <i data-i="w_est"></i></span><b>–</b></li>
          </ul>
          <p class="alt" id="alt">&nbsp;</p>
          <div class="win-a">
            <button class="btn out" id="shareBtn" type="button" aria-haspopup="dialog" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2M5 5l3-3 3 3M3 9v4.5h10V9"/></svg><span data-i="share"></span></button>
{{allLink}}            <a class="chk-l xl" id="checkLink" hidden target="_blank" rel="noopener"><span data-i="check_link"></span><svg class="ext" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 10v3.5H2.5V4H6"/></svg></a>
          </div>
        </div>
      </div>
      <div class="bar">
        <div class="prog" id="prog"><i></i></div>
        <span class="prog-t" id="progTxt">&nbsp;</span>
        <button class="btn sm" id="cliBtn" type="button" aria-haspopup="dialog" aria-controls="cli" data-cli><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6.5l2 1.5-2 1.5M8.5 10h3"/></svg><span data-i="cli_btn"></span></button>
        <button class="btn sm" id="rulesBtn" type="button" aria-haspopup="dialog" aria-controls="rules"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h9M8 4.5 11.5 8 8 11.5M14 3v10"/></svg><span data-i="rules_btn"></span></button>
        <button class="btn pri" id="rerun" type="button" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg><span data-i="rerun"></span></button>
      </div>
    </section>

    <section class="mine card" id="mine">
      <h2 data-i="mine_h"></h2>
      <p class="mine-r" id="mineR" data-i="mine_wait"></p>
      <p class="mine-e" id="mineE"></p>
      <p class="mine-e" id="mineF" hidden></p>
      <p class="note" id="mineC"></p>
    </section>

{{addrCard}}    <section class="cli card">
      <svg class="cli-ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6.5l2 1.5-2 1.5M8.5 10h3"/></svg>
      <h2 class="cli-t" data-i="cli_h"></h2>
      <button class="cmdline" type="button" data-copy title="{{a:copy}}"><code id="cliCmd">{{cliCmd}}</code><svg class="cp" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg><svg class="ok" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></button>
      <div class="cli-links"><button class="lnk" type="button" data-cli aria-haspopup="dialog" aria-controls="cli" data-i="cli_more"></button><a class="cli-gh" href="https://github.com/yt1988/dns-test-cli" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg class="gh-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a></div>
    </section>

    <section class="res card">
      <div class="res-h"><h2 data-i="h_all"></h2><span class="res-l"><a class="who xl" id="whoLink" hidden target="_blank" rel="noopener"><span data-i="who_link"></span><svg class="ext" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 10v3.5H2.5V4H6"/></svg></a><a class="who xl" id="speedLink" hidden target="_blank" rel="noopener"><span data-i="speed_link"></span><svg class="ext" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 10v3.5H2.5V4H6"/></svg></a>{{stLink}}</span></div>
      <div class="tbl" id="tbl">
        <div class="th"><span>#</span><span data-i="c_dns"></span><span data-i="c_doh"></span><span data-why="{{a:tip_est}}" tabindex="0">{{c_udp}}</span><span data-why="{{a:tip_est}}" tabindex="0">{{c_dot}}</span><span data-why="{{a:tip_unc}}" tabindex="0">{{c_unc}}</span><span data-why="{{a:tip_sec}}" tabindex="0">DNSSEC</span></div>
        {{rows}}
      </div>
      {{resNav}}
    </section>

    <div data-ms-more></div>
  </main>
</div>
<div class="scrim" id="cli" hidden>
  <div class="dialog cli-dlg" role="dialog" aria-modal="true" aria-labelledby="cliT">
    <div class="dlg-h"><div><h2 id="cliT"><span data-i="cli_h"></span><a class="gh-link" href="https://github.com/yt1988/dns-test-cli" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg class="gh-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a></h2><p class="note" data-i="cli_sub"></p></div>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="dlg-b">{{cliDlg}}</div>
  </div>
</div>
<div class="scrim" id="rules" hidden>
  <div class="dialog rules" role="dialog" aria-modal="true" aria-labelledby="rulesT">
    <div class="dlg-h"><div><h2 id="rulesT" data-i="rules_h"></h2><p class="note" data-i="rules_sub"></p></div>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="dlg-b">
      <div class="tabs" id="ruleTabs" role="tablist"></div>
      <div id="ruleBody" class="rbody"></div>
      <p class="note" data-i="rules_after"></p>
    </div>
  </div>
</div>
<div class="scrim" id="help" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpT">
    <div class="dlg-h"><h2 id="helpT" data-i="faq_h"></h2>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="help-b">
      <nav class="help-nav" id="helpNav" role="tablist">{{helpNav}}</nav>
      <div class="help-pick">
        <button class="icon-btn" type="button" data-hstep="-1" aria-label="{{a:a_prev}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg></button>
        <select id="helpSel" aria-labelledby="helpT"></select>
        <button class="icon-btn" type="button" data-hstep="1" aria-label="{{a:a_next}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button>
      </div>
      <div class="help-c" id="helpC">{{helpC}}</div>
    </div>
  </div>
</div>

<script type="application/json" id="data">{{data}}</script>
<script src="/assets/{{strings}}"></script>
<script src="/assets/{{js}}"></script>
</body>
</html>
